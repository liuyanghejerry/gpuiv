name: CI
env:
  APP_NAME: gpuiv-native
  MACOSX_DEPLOYMENT_TARGET: "10.13"
"on":
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - docs/**
  pull_request: null
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # ── macOS (Metal) ──────────────────────────────────────────
          # default features include test-support (TestGpuixRenderer)
          - host: macos-latest
            target: aarch64-apple-darwin
            build: bun run build --target aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            build: bun run build --target x86_64-apple-darwin
          # ── Linux (Vulkan/wgpu) ────────────────────────────────────
          # build:release disables test-support until wgpu image readback
          # lands, so a published Linux binary cannot capture screenshots.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: bun run build:release --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build: bun run build:release --target aarch64-unknown-linux-gnu
          # ── Windows (Direct3D) ─────────────────────────────────────
          # Test support includes TestGpuixRenderer and render_to_image.
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: bun run build --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: bun run build --target aarch64-pc-windows-msvc
    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: packages/native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      # Reads the channel from rust-toolchain.toml, which must match zed's
      # pin for the gpui revision in packages/native/Cargo.toml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.settings.target }}
          # this workflow caches cargo explicitly in the next step
          cache: false
          # the action defaults to RUSTFLAGS="-D warnings"; keep lint policy
          # in the crate instead of letting CI deny every warning
          rustflags: ""

      # gpui_apple compiles shaders with `metal`, which Xcode 26 no longer
      # ships by default. Without this the build fails with
      # "cannot execute tool 'metal' due to missing Metal Toolchain".
      - name: Install Metal toolchain
        if: contains(matrix.settings.target, 'apple-darwin')
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/target/
          key: ${{ matrix.settings.target }}-cargo-${{ hashFiles('packages/native/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-

      # Linux system deps for GPUI (Vulkan, Wayland, X11, fonts)
      # Based on longbridge/gpui-component and Zed's script/linux
      - name: Install Linux dependencies
        if: contains(matrix.settings.target, 'linux')
        working-directory: .
        run: |
          # The runner image ships Google's chrome-stable apt repo, whose
          # Packages.gz hash mismatches while their CDN syncs. Nothing below
          # needs Chrome: retry first, then drop that repo and update again.
          sudo apt-get update -o Acquire::Retries=3 || {
            echo '::warning::apt update failed; retrying without the Google Chrome repo'
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
          }
          sudo apt-get install -y \
            gcc g++ clang \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers

      - name: Install dependencies
        working-directory: .
        run: bun install

      - name: Build native
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/native/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test:
    name: test
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-apple-darwin
          path: packages/native/

      - name: Run Vue tests
        run: bun run test
        working-directory: packages/vue

      - name: Run packager tests
        run: bun run test
        working-directory: packages/packager

      - name: Build Vue package
        run: bun run build
        working-directory: packages/vue

      - name: Run example tests
        run: bun run test
        working-directory: examples

  test-windows:
    name: test-windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: packages/native/

      - name: Install dependencies
        run: bun install

      - name: Verify Windows test renderer
        shell: bash
        run: bun -e "const { statSync } = require('node:fs'); const { TestGpuixRenderer } = require('./packages/native'); const renderer = new TestGpuixRenderer(320, 200); renderer.applyBatch(JSON.stringify([['createElement',1,'text'],['setText',1,'Windows test renderer'],['setRoot',1]])); renderer.flush(); renderer.captureScreenshot('windows-test-renderer.png'); if (renderer.getAllText()[0] !== 'Windows test renderer' || statSync('windows-test-renderer.png').size === 0) throw new Error('TestGpuixRenderer did not render')"

      - name: Load native binding with Bun
        run: bun -e "require('./packages/native'); console.log('Windows native binding OK (bun)')"

      - name: Load native binding with Node
        run: node -e "require('./packages/native'); console.log('Windows native binding OK (node)')"

      - name: Run Vue package tests
        run: bun run test
        working-directory: packages/vue

      - name: Build Vue package
        run: bun run build
        working-directory: packages/vue

      - name: Run example tests
        run: bun run test
        working-directory: examples

  # Desktop products for the chat example, built through @gpuiv/packager.
  # Manual runs only (workflow_dispatch): the bindings come from the build
  # matrix above, so no Rust is recompiled here. Each job's packager run
  # smoke-tests its own artifacts through the automation protocol before
  # anything is uploaded. Signing/notarization hooks are P1.
  package-macos:
    name: package-macos
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      # Feed publishing is inert without these secrets (forks stay green).
      GPUIV_S3_ENDPOINT: ${{ secrets.GPUIV_S3_ENDPOINT }}
      GPUIV_S3_REGION: ${{ secrets.GPUIV_S3_REGION }}
      GPUIV_S3_BUCKET: ${{ secrets.GPUIV_S3_BUCKET }}
      GPUIV_S3_PREFIX: ${{ secrets.GPUIV_S3_PREFIX }}
      GPUIV_S3_ACCESS_KEY_ID: ${{ secrets.GPUIV_S3_ACCESS_KEY_ID }}
      GPUIV_S3_SECRET_ACCESS_KEY: ${{ secrets.GPUIV_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download darwin bindings
        uses: actions/download-artifact@v4
        with:
          path: packages/native
          pattern: bindings-*-apple-darwin
          merge-multiple: true

      - name: Build @gpuiv/vue
        run: bun run build
        working-directory: packages/vue

      # arm64 natively, x64 cross-compiled (the smoke test runs it under
      # Rosetta on the arm64 runner). Bounded so a stalled runtime download
      # fails the step instead of holding the job.
      - name: Package chat for darwin
        run: bun run package --target darwin-arm64 --target darwin-x64
        working-directory: examples
        timeout-minutes: 25

      - name: Publish darwin release objects
        if: ${{ env.GPUIV_S3_ENDPOINT != '' }}
        working-directory: examples
        env:
          GPUIV_UPDATE_PRIVATE_KEY: ${{ secrets.GPUIV_UPDATE_PRIVATE_KEY }}
        run: bun run publish-release -- --channel stable --target darwin-arm64 --target darwin-x64

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: app-darwin
          path: examples/dist/package/
          if-no-files-found: error

  package-windows:
    name: package-windows
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      GPUIV_S3_ENDPOINT: ${{ secrets.GPUIV_S3_ENDPOINT }}
      GPUIV_S3_REGION: ${{ secrets.GPUIV_S3_REGION }}
      GPUIV_S3_BUCKET: ${{ secrets.GPUIV_S3_BUCKET }}
      GPUIV_S3_PREFIX: ${{ secrets.GPUIV_S3_PREFIX }}
      GPUIV_S3_ACCESS_KEY_ID: ${{ secrets.GPUIV_S3_ACCESS_KEY_ID }}
      GPUIV_S3_SECRET_ACCESS_KEY: ${{ secrets.GPUIV_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download Windows bindings
        uses: actions/download-artifact@v4
        with:
          path: packages/native
          pattern: bindings-*-pc-windows-msvc
          merge-multiple: true

      - name: Build @gpuiv/vue
        run: bun run build
        working-directory: packages/vue

      # Windows icon/version metadata needs host Windows APIs — this product
      # cannot be cross-compiled from the macOS job.
      - name: Package chat for win32
        run: bun run package --target win32-x64
        working-directory: examples
        shell: bash
        timeout-minutes: 25

      - name: Publish win32 release objects
        if: ${{ env.GPUIV_S3_ENDPOINT != '' }}
        working-directory: examples
        shell: bash
        env:
          GPUIV_UPDATE_PRIVATE_KEY: ${{ secrets.GPUIV_UPDATE_PRIVATE_KEY }}
        run: bun run publish-release -- --channel stable --target win32-x64

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: app-win32
          path: examples/dist/package/
          if-no-files-found: error

  # The single writer of the channel pointer: after both platform jobs have
  # published their immutable fragments, merge them and flip stable.json.
  # Inert without the S3 secrets.
  promote-release:
    name: promote-release
    needs:
      - package-macos
      - package-windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GPUIV_S3_ENDPOINT: ${{ secrets.GPUIV_S3_ENDPOINT }}
      GPUIV_S3_REGION: ${{ secrets.GPUIV_S3_REGION }}
      GPUIV_S3_BUCKET: ${{ secrets.GPUIV_S3_BUCKET }}
      GPUIV_S3_PREFIX: ${{ secrets.GPUIV_S3_PREFIX }}
      GPUIV_S3_ACCESS_KEY_ID: ${{ secrets.GPUIV_S3_ACCESS_KEY_ID }}
      GPUIV_S3_SECRET_ACCESS_KEY: ${{ secrets.GPUIV_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Promote the channel pointer
        if: ${{ env.GPUIV_S3_ENDPOINT != '' }}
        shell: bash
        run: |
          bun install
          VERSION=$(bun -e "console.log((await import('./examples/gpuiv.package.ts')).default.version)")
          echo "promoting $VERSION"
          cd examples
          bun run promote-release -- --channel stable --version "$VERSION" \
            --target darwin-arm64 --target darwin-x64 --target win32-x64

  # Full self-update verification: two packaged versions against an
  # in-process mock S3, the packaged v0.1.0 product auto-downloads and
  # swaps itself to the published v0.2.0 (examples/update-e2e.ts).
  # Manual runs only.
  update-e2e:
    name: update-e2e (${{ matrix.target }})
    needs: build
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: darwin-arm64
            bindings: bindings-aarch64-apple-darwin
          - host: windows-latest
            target: win32-x64
            bindings: bindings-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download bindings
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.bindings }}
          path: packages/native/

      - name: Build @gpuiv/vue
        run: bun run build
        working-directory: packages/vue

      - name: Run the self-update e2e
        working-directory: examples
        shell: bash
        run: bun run update-e2e
        timeout-minutes: 20

  # Publishing uses npm Trusted Publishing (OIDC): no npm token is stored
  # anywhere. Every package's trusted publisher must be configured on
  # npmjs.com (org/user liuyanghejerry, repository gpuiv, workflow ci.yml)
  # before its first OIDC publish. Each package publishes in its own job
  # because every `npm publish` requests an OIDC token from GitHub.
  publish-platform:
    name: publish @gpuiv/native-${{ matrix.target }}
    if: github.repository == 'liuyanghejerry/gpuiv'
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - test-windows
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-x64-gnu
          - linux-arm64-gnu
          - win32-x64-msvc
          - win32-arm64-msvc
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/native/artifacts

      - name: Assemble per-platform packages
        run: |
          bunx @napi-rs/cli create-npm-dirs
          bunx @napi-rs/cli artifacts
        working-directory: packages/native

      - name: Publish @gpuiv/native-${{ matrix.target }}
        run: |
          CURRENT_VERSION=$(node -p "require('../../package.json').version")
          if npm view "@gpuiv/native-${{ matrix.target }}@${CURRENT_VERSION}" version 2>/dev/null; then
            echo "@gpuiv/native-${{ matrix.target }}@${CURRENT_VERSION} already published, skipping"
          else
            echo "Publishing @gpuiv/native-${{ matrix.target }}@${CURRENT_VERSION}"
            npm publish --access public --provenance
          fi
        working-directory: packages/native/npm/${{ matrix.target }}

  publish-native:
    name: publish @gpuiv/native
    if: github.repository == 'liuyanghejerry/gpuiv'
    runs-on: ubuntu-latest
    needs:
      - publish-platform
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/native/artifacts

      - name: Assemble per-platform packages
        run: |
          bunx @napi-rs/cli create-npm-dirs
          bunx @napi-rs/cli artifacts
        working-directory: packages/native

      # Writes the per-platform optionalDependencies into packages/native/
      # package.json and copies the .node files. --skip-optional-publish
      # leaves the platform publishes to the publish-platform matrix.
      - name: Write optionalDependencies
        run: bunx @napi-rs/cli pre-publish -t npm --no-gh-release --skip-optional-publish
        working-directory: packages/native

      # --ignore-scripts skips prepublishOnly, whose napi pre-publish would
      # re-run the platform publishes that publish-platform already did.
      - name: Publish @gpuiv/native
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "@gpuiv/native@${CURRENT_VERSION}" version 2>/dev/null; then
            echo "@gpuiv/native@${CURRENT_VERSION} already published, skipping"
          else
            echo "Publishing @gpuiv/native@${CURRENT_VERSION}"
            npm publish --ignore-scripts --access public --provenance
          fi
        working-directory: packages/native

  publish-vue:
    name: publish @gpuiv/vue
    if: github.repository == 'liuyanghejerry/gpuiv'
    runs-on: ubuntu-latest
    needs:
      - publish-native
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build @gpuiv/vue
        run: bun run build
        working-directory: packages/vue

      - name: Publish @gpuiv/vue
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "@gpuiv/vue@${CURRENT_VERSION}" version 2>/dev/null; then
            echo "@gpuiv/vue@${CURRENT_VERSION} already published, skipping"
          else
            echo "Publishing @gpuiv/vue@${CURRENT_VERSION}"
            node -e "
              const fs = require('fs')
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
              const native = require('../native/package.json').version
              pkg.dependencies['@gpuiv/native'] = '^' + native
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
            "
            npm publish --access public --provenance
          fi
        working-directory: packages/vue
